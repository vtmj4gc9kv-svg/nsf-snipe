name: scan
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency:
  group: scan
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright requests
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-v1
      - run: python -m playwright install --with-deps chromium
      - run: python scan_once.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save data
        run: |
          git config user.name "snipebot"
          git config user.email "snipebot@users.noreply.github.com"
          git add data seen_items.json
          git diff --cached --quiet || (git commit -m "data" && git pull --rebase && git push)
