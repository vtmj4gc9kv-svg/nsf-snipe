<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0d12">
<title>NSF Snipebot</title>
<style>
:root{color-scheme:dark;--bg:#0d0d12;--card:#17171f;--bd:#262633;--tx:#f1f1f5;--mu:#8a8a9a;--normal:#9aa4b2;--rare:#4da3ff;--mythic:#b86bff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top) 14px calc(24px + env(safe-area-inset-bottom));min-height:100vh}
h1{font-size:26px;letter-spacing:.5px;margin:28px 0 4px}
h1 span{color:var(--mythic)}
.sub{color:var(--mu);font-size:13px}
.big{display:block;width:100%;text-align:left;margin-top:14px;padding:26px 20px;border-radius:18px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
.big b{display:block;font-size:22px}
.big small{color:var(--mu)}
.top{display:flex;align-items:center;gap:10px;margin:16px 0 10px}
.back{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:8px 12px;font:inherit}
.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px;margin:8px 0 12px}
.seg button{flex:1;border:0;border-radius:9px;padding:10px;background:none;color:var(--mu);font:inherit;font-weight:600}
.seg button.on{background:var(--c);color:#0d0d12}
.item{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--c);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:10px}
.price{font-weight:700;white-space:nowrap;color:var(--c)}
.mu{color:var(--mu);font-size:13px;margin-top:2px}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3ddc84;margin-right:6px;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.25}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $ = s => document.querySelector(s);
const P = new URLSearchParams(location.search);
let key = P.get('k') || '';
try { if (key) localStorage.setItem('k', key); else key = localStorage.getItem('k') || ''; } catch (e) {}
const COLORS = { normal: 'var(--normal)', rare: 'var(--rare)', mythic: 'var(--mythic)' };
const NAMES = { clothing: 'Clothing', accessories: 'Accessories' };
const COND = { nwt: 'New with tags', nwot: 'New without tags', very_good: 'Very good', good: 'Good', satisfactory: 'Satisfactory' };
let cat = null, rarity = 'normal', data = { state: {}, hits: [] };

const RAW = 'https://raw.githubusercontent.com/vtmj4gc9kv-svg/nsf-snipe/main/data/';
const get = f => fetch(RAW + f + '?t=' + Date.now()).then(r => { if (!r.ok) throw 0; return r.json(); });
const api = (path, body) => {
  if (body) return Promise.resolve({});
  return Promise.all([get('hits.json'), get('status.json').catch(() => ({}))])
    .then(([hits, st]) => ({ state: st, hits: hits }));
};
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ago = ts => { const s = Date.now() / 1000 - ts; return s < 60 ? 'just now' : s < 3600 ? Math.floor(s / 60) + ' min' : s < 86400 ? Math.floor(s / 3600) + ' h' : Math.floor(s / 86400) + ' d'; };

function home() {
  cat = null;
  $('#app').innerHTML = `<h1>NSF <span>Snipebot</span></h1><div class="sub" id="conn">Choose a category</div>
    <button class="big" data-c="clothing"><b>Clothing</b><small>Sweaters, jackets, vests, hoodies, long-sleeves</small></button>
    <button class="big" data-c="accessories"><b>Accessories</b><small>Bags, wallets, belts, scarves</small></button>`;
  document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => choose(b.dataset.c));
}

function choose(c) {
  cat = c; rarity = 'normal';
  api('/api/category', { category: c }).then(load).catch(() => {});
  results();
}

function results() {
  const col = COLORS[rarity];
  const ids = new Set(), keys = new Set(); const list = data.hits.filter(h => h.category === cat && h.rarity === rarity).filter(h => { const id = (h.url.match(/items\/(\d+)/) || [])[1] || h.url; const k = (h.brand + h.title + h.price).toLowerCase(); if (ids.has(id) || keys.has(k)) return false; ids.add(id); keys.add(k); return true; });
  const st = data.state;
  $('#app').innerHTML = `<div class="top"><button class="back" id="back">‹ Back</button><div><b>${NAMES[cat]}</b>
    <div class="sub"><span class="dot"></span>${st.last_run ? 'Last scan: ' + ago(st.last_run) + (st.blocked > st.total / 2 ? ' · Vinted may be blocking' : '') : 'Waiting for first scan…'}</div></div></div>
    <div class="seg" style="--c:${col}">${['normal', 'rare', 'mythic'].map(r =>
      `<button data-r="${r}" class="${r === rarity ? 'on' : ''}" style="${r === rarity ? '--c:' + COLORS[r] : ''}">${r[0].toUpperCase() + r.slice(1)}</button>`).join('')}</div>
    ${list.length ? list.map(h => `<a class="item" style="--c:${col}" href="${esc(h.url)}" target="_blank" rel="noopener">
        <div class="row"><b>${esc(h.title)}</b><span class="price">${h.price.toFixed(2)} €</span></div>
        <div class="mu">${esc(h.brand)}${h.size ? ' · ' + esc(h.size) : ''} · ${COND[h.condition] || ''} · ${ago(h.ts)}</div></a>`).join('')
      : '<div class="empty">Nothing found yet.<br>The bot is searching automatically.</div>'}`;
  $('#back').onclick = () => { api('/api/category', { category: null }).catch(() => {}); home(); };
  document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { rarity = b.dataset.r; results(); });
}

function load() {
  return api('/api/state').then(d => { data = d; if (cat) results(); }).catch(() => {
    if (!cat && $('#conn')) $('#conn').textContent = 'No data yet'; });
}

api('/api/category', { category: null }).catch(() => {});  // first page always starts idle
home(); load(); setInterval(load, 60000);
</script>
</body>
</html>
